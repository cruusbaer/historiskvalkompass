<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historisk Valkompass 1928</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1 id="election-title">Historisk Valkompass</h1>
      <p id="election-desc" class="subtitle"></p>
    </header>

    <main id="quiz-screen">
      <div class="progress-bar-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div class="progress-text">Fråga <span id="current-step">1</span> av <span id="total-steps">16</span></div>

      <div class="card">
        <span id="question-category" class="badge">Kategori</span>
        <h2 id="question-title">Frågetitel</h2>
        
        <div class="statement-box">
          <p id="question-statement"></p>
        </div>

        <div class="context-box">
          <p id="question-context" class="context-text collapsed"></p>
          <button id="read-more-btn" class="btn-read-more">Läs mer...</button>
        </div>

        <div class="arguments-grid">
          <div class="arg-box pro">
            <strong>Argument För:</strong>
            <p id="arg-for"></p>
          </div>
          <div class="arg-box con">
            <strong>Argument Emot:</strong>
            <p id="arg-against"></p>
          </div>
        </div>
      </div>

      <!-- 5-gradig horisontell skala -->
      <div class="scale-container">
        <div class="scale-buttons">
          <button class="scale-btn val-1" data-value="1" title="Helt emot">1</button>
          <button class="scale-btn val-2" data-value="2" title="Delvis emot">2</button>
          <button class="scale-btn val-3" data-value="3" title="Neutral / Hoppa över">3</button>
          <button class="scale-btn val-4" data-value="4" title="Delvis för">4</button>
          <button class="scale-btn val-5" data-value="5" title="Helt för">5</button>
        </div>
        <div id="scale-label" class="scale-label">3. Neutral / Hoppa över</div>
      </div>
    </main>

    <!-- Vad hände sedan & Resultatsida -->
    <section id="result-screen" class="hidden">
      <h2>Ditt resultat & Historiskt Utfall</h2>
      <div id="top-match" class="top-match-card"></div>

      <div class="outcome-section">
        <h3>Regeringsbildning & Mandat 1928</h3>
        <p id="gov-info"></p>
        <div id="mandates-chart" class="mandates-chart"></div>
      </div>

      <h3>Fråga för fråga – Vad hände sedan?</h3>
      <div id="outcomes-list" class="outcomes-list"></div>

      <button id="restart-btn" class="btn-primary">Gör om kompassen</button>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
